<!-- Button Components - Componentes Reutilizáveis de Botões -->

<!-- Primary Button -->
<!-- Uso: <button class="btn btn-primary">Texto do Botão</button> -->
<style>
  .btn {
    padding: 0.75rem 1.5rem;
    font-weight: 600;
    border-radius: 0.5rem;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Primary */
  .btn-primary {
    background-color: #0ea5e9;
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: #0284c7;
  }

  .btn-primary:active:not(:disabled) {
    background-color: #0369a1;
  }

  /* Secondary */
  .btn-secondary {
    background-color: #e0f2fe;
    color: #0369a1;
    border: 1px solid #7dd3fc;
  }

  .btn-secondary:hover:not(:disabled) {
    background-color: #bae6fd;
  }

  /* Ghost */
  .btn-ghost {
    background-color: transparent;
    color: #0ea5e9;
    border: 2px solid #0ea5e9;
  }

  .btn-ghost:hover:not(:disabled) {
    background-color: #f0f9ff;
  }

  /* Sizes */
  .btn-sm {
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
  }

  .btn-lg {
    padding: 1rem 2rem;
    font-size: 1.125rem;
  }

  .btn-full {
    width: 100%;
  }
</style>

<!-- Exemplos de uso: -->
<button class="btn btn-primary">Solicitar Orçamento</button>
<button class="btn btn-secondary">Saiba Mais</button>
<button class="btn btn-ghost">Contato</button>

<button class="btn btn-primary btn-sm">Pequeno</button>
<button class="btn btn-primary btn-lg">Grande</button>

<button class="btn btn-primary btn-full">Largura Completa</button>
<button class="btn btn-primary" disabled>Desabilitado</button>
